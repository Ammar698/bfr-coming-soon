<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WFR — Coming Soon</title>
  <meta name="description" content="WFR for efficiency — Something powerful is on the way." />
  <link rel="icon" href="wfr-logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-deep: #020817;
      --bg-mid: #060e24;
      --blue-1: #2563eb;
      --blue-2: #3b82f6;
      --blue-3: #60a5fa;
      --cyan-1: #0ea5e9;
      --cyan-2: #22d3ee;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-deep);
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ── Canvas ────────────────────────────────────── */
    #particles {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── Background layers ─────────────────────────── */
    .bg-gradient {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse at 50% 30%, #0c1f4a 0%, #060e24 40%, #020817 100%);
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0.03;
      background-image:
        linear-gradient(rgba(59,130,246,0.3) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.3) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(2,8,23,0.7) 100%);
    }

    /* ── Scan line ─────────────────────────────────── */
    .scan-line {
      position: fixed;
      left: 0;
      right: 0;
      height: 1px;
      z-index: 3;
      background: linear-gradient(90deg, transparent, rgba(59,130,246,0.3), transparent);
      animation: scanDown 8s linear infinite;
    }

    @keyframes scanDown {
      0% { top: 0; }
      100% { top: 100%; }
    }

    /* ── Floating orbs ─────────────────────────────── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 1;
      pointer-events: none;
    }
    .orb-1 {
      width: 400px; height: 400px;
      background: rgba(37,99,235,0.08);
      top: 5%; left: 3%;
      animation: orbFloat1 20s ease-in-out infinite;
    }
    .orb-2 {
      width: 350px; height: 350px;
      background: rgba(14,165,233,0.06);
      bottom: 5%; right: 3%;
      animation: orbFloat2 25s ease-in-out infinite;
    }
    .orb-3 {
      width: 250px; height: 250px;
      background: rgba(99,102,241,0.06);
      top: 45%; right: 18%;
      animation: orbFloat3 18s ease-in-out infinite;
    }

    @keyframes orbFloat1 {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(100px, -80px); }
      66% { transform: translate(-50px, 60px); }
    }
    @keyframes orbFloat2 {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(-120px, 60px); }
      66% { transform: translate(80px, -100px); }
    }
    @keyframes orbFloat3 {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(60px, -40px); }
      66% { transform: translate(-60px, 80px); }
    }

    /* ── Rotating rings ────────────────────────────── */
    .rings {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      pointer-events: none;
    }
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(59,130,246,0.08);
    }
    .ring-1 {
      width: 700px; height: 700px;
      animation: ringRotate 60s linear infinite, ringPulse 8s ease-in-out infinite;
      box-shadow: 0 0 80px 20px rgba(59,130,246,0.04), inset 0 0 80px 20px rgba(59,130,246,0.02);
    }
    .ring-2 {
      width: 480px; height: 480px;
      border-color: rgba(34,211,238,0.06);
      animation: ringRotateReverse 45s linear infinite;
      box-shadow: 0 0 60px 15px rgba(34,211,238,0.03), inset 0 0 60px 15px rgba(34,211,238,0.015);
    }

    @keyframes ringRotate { to { transform: rotate(360deg); } }
    @keyframes ringRotateReverse { to { transform: rotate(-360deg); } }
    @keyframes ringPulse {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.05); }
    }

    /* ── Main content ──────────────────────────────── */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      gap: 2rem;
      animation: fadeInUp 1s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Logo */
    .logo-wrap {
      animation: fadeInUp 1s ease-out;
    }
    .logo-wrap img {
      width: 240px;
      max-width: 70vw;
      border-radius: 16px;
      box-shadow: 0 0 60px rgba(59,130,246,0.2), 0 25px 50px rgba(0,0,0,0.4);
    }

    /* Heading */
    .heading {
      text-align: center;
      animation: fadeInUp 1s ease-out 0.2s both;
    }
    .heading h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 0%, #bfdbfe 50%, #60a5fa 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.3;
      padding-bottom: 0.1em;
    }
    .heading p {
      margin-top: 0.75rem;
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      color: rgba(191,219,254,0.85);
      max-width: 480px;
      line-height: 1.6;
    }

    /* ── Timer ─────────────────────────────────────── */
    .timer {
      display: flex;
      align-items: flex-start;
      gap: clamp(0.6rem, 2vw, 1.5rem);
      animation: fadeInUp 1s ease-out 0.5s both;
    }

    .timer-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

    .timer-card {
      position: relative;
      width: clamp(64px, 15vw, 110px);
      height: clamp(76px, 18vw, 126px);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(15,30,70,0.9) 0%, rgba(10,20,50,0.95) 50%, rgba(5,15,40,0.9) 100%);
      border: 1px solid rgba(59,130,246,0.2);
      box-shadow: 0 0 30px rgba(59,130,246,0.12), inset 0 1px 0 rgba(255,255,255,0.05);
      overflow: hidden;
    }

    .timer-card::before {
      content: '';
      position: absolute;
      inset: 0 0 50% 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 100%);
      pointer-events: none;
    }

    .timer-card::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(96,165,250,0.1);
    }

    .timer-card .glow {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      height: 16px;
      border-radius: 50%;
      background: rgba(59,130,246,0.15);
      filter: blur(10px);
    }

    .timer-value {
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 20px rgba(96,165,250,0.5);
      font-variant-numeric: tabular-nums;
      position: relative;
      z-index: 1;
      transition: transform 0.3s ease;
    }

    .timer-value.flip {
      animation: flipIn 0.5s ease-out;
    }

    @keyframes flipIn {
      0% { transform: rotateX(-80deg); opacity: 0.3; }
      100% { transform: rotateX(0deg); opacity: 1; }
    }

    .timer-label {
      font-size: clamp(0.55rem, 1.2vw, 0.8rem);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: rgba(147,197,253,0.8);
    }

    /* Separator */
    .separator {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: clamp(1.2rem, 3vw, 2rem);
    }
    .separator .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--blue-3);
      box-shadow: 0 0 8px rgba(96,165,250,0.6);
      animation: pulse 1.5s ease-in-out infinite;
    }
    .separator .dot:nth-child(2) { animation-delay: 0.2s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* ── Contact section ──────────────────────────── */
    .contact {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      animation: fadeInUp 1s ease-out 0.8s both;
    }
    .contact-label {
      font-size: 0.75rem;
      color: rgba(191,219,254,0.75);
      letter-spacing: 0.05em;
    }
    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 2rem;
      border-radius: 14px;
      background: linear-gradient(135deg, #25d366, #128c7e);
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.02em;
      box-shadow: 0 0 30px rgba(37,211,102,0.3), 0 0 60px rgba(18,140,126,0.12);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .whatsapp-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(37,211,102,0.45), 0 0 80px rgba(18,140,126,0.2);
    }
    .whatsapp-btn:active { transform: scale(0.97); }
    .whatsapp-btn svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }
    .email-btn {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      box-shadow: 0 0 30px rgba(59,130,246,0.3), 0 0 60px rgba(29,78,216,0.12);
    }
    .email-btn:hover {
      box-shadow: 0 0 40px rgba(59,130,246,0.45), 0 0 80px rgba(29,78,216,0.2);
    }

    /* ── Footer line ───────────────────────────────── */
    .footer {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: rgba(191,219,254,0.85);
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      animation: fadeInUp 1s ease-out 1.1s both;
      margin-top: 0.5rem;
    }
    .footer .line {
      width: 32px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(147,197,253,0.5));
    }
    .footer .line:last-child {
      background: linear-gradient(90deg, rgba(147,197,253,0.5), transparent);
    }

    /* ── Mobile adjustments ────────────────────────── */
    @media (max-width: 480px) {
      .ring-1 { width: 400px; height: 400px; }
      .ring-2 { width: 280px; height: 280px; }
    }
  </style>
</head>
<body>
  <!-- Background layers -->
  <div class="bg-gradient"></div>

  <canvas id="particles"></canvas>
  <div class="orb orb-1"></div>

  <div class="orb orb-3"></div>

  <!-- Content -->
  <main class="content">

    <div class="logo-wrap">

      <div class="timer-block">

          <span class="timer-value" id="minutes">00</span>
          <div class="glow"></div>
        </div>
        <span class="timer-label">Minutes</span>
      </div>
      <div class="separator"><div class="dot"></div><div class="dot"></div></div>
      <div class="timer-block">
        <div class="timer-card">
          <span class="timer-value" id="seconds">00</span>
          <div class="glow"></div>
        </div>
        <span class="timer-label">Seconds</span>
      </div>
    </div>

    <!-- Contact -->
    <div class="contact">
      <span class="contact-label">For any query and information</span>
      <a href="https://wa.me/966552647280" target="_blank" rel="noopener noreferrer" class="whatsapp-btn">

  <script>
    // ── Countdown Timer (1 month from now) ────────────
    const TARGET = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).getTime();

    const $days = document.getElementById('days');
    const $hours = document.getElementById('hours');
    const $minutes = document.getElementById('minutes');
    const $seconds = document.getElementById('seconds');

    function pad(n) { return String(n).padStart(2, '0'); }

    function updateVal(el, val) {
      const str = pad(val);
      if (el.textContent !== str) {
        el.textContent = str;
        el.classList.remove('flip');
        void el.offsetWidth; // reflow
        el.classList.add('flip');
      }
    }

    function tick() {
      const diff = Math.max(0, TARGET - Date.now());
      updateVal($days, Math.floor(diff / 86400000));
      updateVal($hours, Math.floor((diff / 3600000) % 24));
      updateVal($minutes, Math.floor((diff / 60000) % 60));
      updateVal($seconds, Math.floor((diff / 1000) % 60));
    }

    tick();
    setInterval(tick, 1000);

    // ── Particle Network ──────────────────────────────
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const COLORS = [
      'rgba(59,130,246,',
      'rgba(96,165,250,',
      'rgba(37,99,235,',
      'rgba(147,197,253,',
      'rgba(255,255,255,',
    ];

    const particles = [];
    const COUNT = 100;

    for (let i = 0; i < COUNT; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5,
        r: Math.random() * 2.5 + 0.5,
        alpha: Math.random() * 0.6 + 0.1,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
      });
    }

    // Mouse interaction
    let mouse = { x: -9999, y: -9999 };
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

    function drawParticles() {
      ctx.clearRect(0, 0, W, H);

      // Connections
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 140) {
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(59,130,246,' + (0.08 * (1 - dist / 140)) + ')';
            ctx.lineWidth = 0.5;
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }

      // Particles
      for (const p of particles) {
        // Mouse repel
        const mdx = p.x - mouse.x;
        const mdy = p.y - mouse.y;
        const mDist = Math.sqrt(mdx * mdx + mdy * mdy);
        if (mDist < 120) {
          const force = (120 - mDist) / 120 * 0.8;
          p.vx += (mdx / mDist) * force;
          p.vy += (mdy / mDist) * force;
        }

        // Dampen
        p.vx *= 0.99;
        p.vy *= 0.99;

        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;

        // Dot
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color + p.alpha + ')';
        ctx.fill();

        // Glow
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
        g.addColorStop(0, p.color + (p.alpha * 0.3) + ')');
        g.addColorStop(1, p.color + '0)');
        ctx.fillStyle = g;
        ctx.fill();
      }

      // Mouse glow
      if (mouse.x > 0) {
        const mg = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 150);
        mg.addColorStop(0, 'rgba(59,130,246,0.06)');
        mg.addColorStop(1, 'rgba(59,130,246,0)');
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 150, 0, Math.PI * 2);
        ctx.fillStyle = mg;
        ctx.fill();
      }

      requestAnimationFrame(drawParticles);
    }

    drawParticles();

  </script>
</body>
